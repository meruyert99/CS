<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Signal Quest 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky status bar + journey track (avatar moves one step per correct answer toward the goal); one task card below. */
/* Light arcade: pixel city backdrop, pixel display face for labels, readable Rubik for questions; one deliberate light look. */
:root{
  --bg:#EAF0FF; --surface:#FFFFFF; --raised:#F7F8FF; --ink:#1A1433; --muted:#585274; --line:#CFC8EC; --shadow:#2A2150;
  --accent:#FFC93C; --on-accent:#1A1433; --good:#137A45; --good-bg:#DDF7E8; --warn:#8A6100; --warn-bg:#FFF1C7; --bad:#C2283A; --bad-bg:#FFE1E5;
  --display:'Press Start 2P', 'Courier New', monospace; --body:'Rubik', Arial, sans-serif; --mono:'JetBrains Mono', 'Courier New', monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(var(--line) 1px, transparent 1px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px 4px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--accent)}
.stat{font-family:var(--mono);font-size:14px;display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.stat b{font-weight:600;font-size:16px}
.stat small{color:var(--muted);font-family:var(--body);font-size:11px;text-transform:uppercase;letter-spacing:1px}
/* journey */
.journey{max-width:860px;margin:0 auto;padding:8px 0 12px}
.track{position:relative;height:64px;margin:0 18px}
.track .line{position:absolute;left:0;right:0;top:22px;height:4px;border-radius:2px;background:var(--line)}
.track .fill{position:absolute;left:0;top:22px;height:4px;border-radius:2px;background:var(--accent);transition:width .6s ease}
.step{position:absolute;top:20px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--line)}
.step.g{background:var(--good)} .step.a{background:var(--warn)} .step.r{background:var(--bad)}
.station{position:absolute;top:14px;width:20px;height:20px;margin-left:-10px;border-radius:6px;background:var(--surface);border:2px solid var(--line);transform:rotate(45deg)}
.station.on{border-color:var(--accent);background:var(--accent)}
.slabel{position:absolute;top:40px;transform:translateX(-50%);font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.slabel.on{color:var(--ink);font-weight:600}
.goal{position:absolute;right:-18px;top:6px;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--ink) 0 25%, var(--surface) 0 50%) 0 0/12px 12px;border:2px solid var(--ink)}
.avatar{position:absolute;top:2px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;box-shadow:0 0 0 4px var(--surface);transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.avatar svg{width:26px;height:26px}
.hop{animation:hop .6s ease}
@keyframes hop{40%{transform:translateY(-12px)}}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(34px,7vw,56px);font-weight:700}
h2{font-size:clamp(24px,4.5vw,32px);font-weight:700}
h3{font-size:20px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px}
.btn{font:600 16px var(--body);border:0;border-radius:10px;padding:13px 22px;background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;min-height:38px;font-size:14px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input[type=text]{font:500 18px var(--body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);width:100%;max-width:420px}
input.mono{font-family:var(--mono)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.rules div{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.rules b{font-family:var(--display);font-size:22px}
.stops{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:500 13px var(--mono)}
.stops span{padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stops i{color:var(--muted);font-style:normal}
.thead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.code-pill{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;color:var(--on-accent);background:var(--accent)}
.scen{background:var(--bg);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:15px}
.q{font-size:20px;font-weight:600;line-height:1.4}
.how{font-size:14px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt,.chip,.tok,.seg button,.tt button{font:500 16px var(--body);text-align:left;background:var(--raised);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px}
.opt:disabled{opacity:.55;cursor:not-allowed;text-decoration:line-through}
.opt.sel,.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt.multi{display:flex;gap:12px;align-items:center}
.opt.multi::before{content:"";flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--muted)}
.opt.multi.sel::before{background:var(--accent);border-color:var(--accent)}
.good{border-color:var(--good)!important;background:var(--good-bg)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.chip{display:flex;gap:10px;align-items:center;font-size:15px}
.chip::before{content:attr(data-tag);flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:600 13px var(--mono);background:var(--bg);color:var(--muted)}
.chip[data-tag=""]::before{content:"·"}
.chip.linked::before{background:var(--accent);color:var(--on-accent)}
.seq{min-height:60px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;margin:0;list-style:none}
.seq.inline{flex-direction:row;flex-wrap:wrap}
.seq:empty::after{content:attr(data-empty);color:var(--muted);font-size:14px;padding:6px}
.pool{display:flex;flex-direction:column;gap:8px}
.pool.inline{flex-direction:row;flex-wrap:wrap}
.tok{font-family:var(--mono);font-size:15px;padding:8px 12px;min-height:42px}
.sortrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;min-height:40px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ttwrap,.refwrap{overflow-x:auto}
table.tt,table.ref{border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.tt{font-size:16px}
table.ref{font-size:13px;margin-top:6px}
.tt th,.tt td,.ref th,.ref td{border:1px solid var(--line);padding:5px 12px;text-align:center}
.ref td{text-align:left}
.tt th,.ref th{background:var(--bg)}
.tt button{font-family:var(--mono);text-align:center;min-width:56px;min-height:40px;padding:6px}
.expr{font-family:var(--mono);font-size:17px;background:var(--bg);padding:8px 12px;border-radius:8px;align-self:flex-start}
.refs{display:flex;flex-wrap:wrap;gap:16px}
details.refbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.refbox summary{cursor:pointer;font-weight:600}
.fb{border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.part{background:var(--warn-bg);border-color:var(--warn)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb .v{font-family:var(--display);font-size:22px;font-weight:700}
.fb ul,.fb ol{margin:0;padding-left:22px}
.ans{font-family:var(--mono);font-size:14px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:20;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}
.lbtable{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.lbtable th{font:600 12px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.lbtable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.lbtable tr.me td{background:var(--warn-bg);font-weight:600}
.lbtable td.r{text-align:right;font-family:var(--mono)}
.rank{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--bg);font:600 14px var(--mono)}
.rank.t1,.rank.t2,.rank.t3{background:var(--accent);color:var(--on-accent)}
.pill{display:inline-block;font:500 12px var(--mono);padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.done{border-color:var(--good);color:var(--good)}
.lbwrap{overflow-x:auto}
.big{font-family:var(--display);font-size:clamp(56px,14vw,96px);font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.res-row{display:grid;grid-template-columns:minmax(0,1.6fr) 3fr 64px;gap:12px;align-items:center;font-size:14px}
.res-row b{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
details.miss{border-top:1px solid var(--line);padding-top:10px}
details.miss summary{cursor:pointer;font-weight:600}
details.miss ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (max-width:640px){.cols{grid-template-columns:1fr}.q{font-size:18px}.panel{padding:18px}.slabel{display:none}.slabel.on{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- arcade skin ---- */

<script>
const Q=QUEST, N=Q.tasks.length, KEY='formative.'+Q.id+'.v1';
let S=load()||fresh();
function fresh(){return {name:'',started:null,finished:null,order:null,res:[]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.res)?x:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function el(t,a={},...kids){const e=document.createElement(t);for(const k in a){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.setAttribute('style',v);else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffledNot(a){if(a.length<2)return a.slice();let s,n=0;do{s=shuffle(a);n++}while(n<20&&s.every((x,i)=>x===a[i]));return s}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
const app=document.getElementById('app');
const pts=()=>S.res.reduce((a,r)=>a+r.p,0);           // each task 0..1
const mark=()=>Math.round(pts()/N*100)/10;             // out of 10, one decimal
const correct=()=>S.res.filter(r=>r.ok).length;
document.getElementById('brand').innerHTML=Q.brand;
function updBar(){document.getElementById('sMark').textContent=mark().toFixed(1);
 document.getElementById('sTask').textContent=Math.min(S.res.length+1,N)+'/'+N;
 document.getElementById('sTime').textContent=fmt(S.started?((S.finished||Date.now())-S.started):0)}
setInterval(updBar,1000);
function toast(msg){const t=el('div',{class:'toast',role:'status'},msg);document.body.append(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400)},2000)}
function go(fn){app.replaceChildren();fn();updBar();drawTrack();window.scrollTo({top:0})}
/* journey track: avatar position = correct answers / N */
let lastPos=null;
function stationAt(pos){let k=0;Q.stations.forEach((s,i)=>{if(pos>=i/(Q.stations.length-1)-1e-9)k=i});return k}
function drawTrack(){
 const tr=document.getElementById('track');const pos=correct()/N;
 const kids=[el('div',{class:'line'}),el('div',{class:'fill',style:`width:${pos*100}%`})];
 for(let i=0;i<N;i++){const r=S.res[i];kids.push(el('div',{class:'step'+(r?(r.ok?(r.p===1?' g':' a'):' r'):''),style:`left:${(i+0.5)/N*100}%`}))}
 const cur=stationAt(pos);
 Q.stations.forEach((s,i)=>{const x=i/(Q.stations.length-1)*100;if(i===Q.stations.length-1)return;
  kids.push(el('div',{class:'station'+(i<=cur?' on':''),style:`left:${x}%`}),el('div',{class:'slabel'+(i===cur?' on':''),style:`left:${Math.max(4,Math.min(96,x))}%`},s))});
 kids.push(el('div',{class:'goal',title:Q.stations[Q.stations.length-1],'aria-hidden':'true'}));
 const av=el('div',{class:'avatar',style:`left:${(lastPos??pos)*100}%`,'aria-label':`Progress: ${correct()} of ${N} correct, at ${Q.stations[cur]}`,html:Q.avatar});
 kids.push(av);tr.replaceChildren(...kids);
 if(lastPos!==null&&lastPos!==pos){requestAnimationFrame(()=>{av.style.left=pos*100+'%';av.classList.add('hop')});
  const prev=stationAt(lastPos);if(cur>prev)setTimeout(()=>toast(cur===Q.stations.length-1?Q.goalToast:'Reached: '+Q.stations[cur]),500)}
 lastPos=pos;
}
/* class leaderboard (shared db; each student writes results/<their id>) */
const LB={db:null,uid:null,owner:false,canWrite:true,rows:[],state:'off',q:Promise.resolve()};
function lbBody(){return {name:S.name,mark:mark(),correct:correct(),firstTry:S.res.filter(r=>r.ok&&r.a===1).length,done:S.res.length,total:N,finished:S.res.length>=N,
 timeMs:S.started?((S.finished||Date.now())-S.started):0,attempt:S.attempt||1,updatedAt:new Date().toISOString()}}
function pushResult(){if(!LB.db||!LB.uid||!LB.canWrite||!S.name)return;const body=lbBody();
 LB.q=LB.q.then(()=>LB.db.doc('results/'+LB.uid).set(body)).catch(e=>{if(e&&e.code==='invalid_argument')LB.canWrite=false});}
(async()=>{try{const c=window.claude;if(!c||!c.use)return;
 const [db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db)return;LB.db=db;
 if(user){LB.uid=await user.id();LB.owner=await user.isOwner().catch(()=>false);if(await user.can('data.write').catch(()=>null)===false)LB.canWrite=false}
 LB.state='loading';paintBoards();const timer=setTimeout(()=>{if(LB.state==='loading'){LB.state='slow';paintBoards()}},10000);
 db.collection('results').onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);LB.rows=snap.docs.map(d=>Object.assign({id:d.id},d.data()));LB.state='ok';paintBoards()},
  ()=>{clearTimeout(timer);LB.state='error';paintBoards()});
 if(S.started)pushResult();
}catch(e){}})();
function sortedRows(){return LB.rows.filter(r=>r&&typeof r.name==='string').slice().sort((a,b)=>(b.mark||0)-(a.mark||0)||(b.done||0)-(a.done||0)||(a.timeMs||0)-(b.timeMs||0))}
function boardEl(){const box=el('div',{class:'lbbox'});box._paint=()=>{
 let body;
 if(LB.state==='off')body=el('p',{class:'muted'},'The class leaderboard is not available in this view. Your own result is still shown above.');
 else if(LB.state==='loading')body=el('p',{class:'muted'},'Loading the leaderboard…');
 else if(LB.state==='error')body=el('p',{class:'muted'},'The leaderboard could not be loaded. Your own result is still saved on this device.');
 else{const rows=sortedRows();
  if(!rows.length)body=el('p',{class:'muted'},LB.state==='slow'?'The leaderboard cannot be reached yet.':'No results yet. Names appear here as soon as students start.');
  else body=el('div',{class:'lbwrap'},el('table',{class:'lbtable'},
   el('tr',{},el('th',{},'#'),el('th',{},'Name'),el('th',{style:'text-align:right'},'Mark'),el('th',{},'Progress'),el('th',{style:'text-align:right'},'Time'),LB.owner?el('th',{},''):null),
   rows.map((r,i)=>{const me=r.id===LB.uid;const delCell=LB.owner?el('td',{},delBtn(r)):null;
    return el('tr',{class:me?'me':''},el('td',{},el('span',{class:'rank t'+(i+1)},i+1)),
     el('td',{},r.name,me?el('span',{class:'muted'},' (you)'):null,(r.attempt||1)>1?el('span',{class:'pill',style:'margin-left:8px'},'attempt '+r.attempt):null),
     el('td',{class:'r'},Number(r.mark||0).toFixed(1)),
     el('td',{},r.finished?el('span',{class:'pill done'},'finished'):el('span',{class:'pill'},(r.done||0)+'/'+(r.total||N))),
     el('td',{class:'r'},fmt(r.timeMs||0)),delCell)})));
  if(LB.state==='slow'&&rows.length)body=el('div',{},el('p',{class:'muted',style:'font-size:13px'},'May be out of date.'),body);}
 box.replaceChildren(body)};box._paint();return box}
function delBtn(r){const w=el('span',{});const b=el('button',{class:'btn ghost small',type:'button',onclick:()=>{w.replaceChildren(
 el('button',{class:'btn small',type:'button',onclick:async()=>{try{await LB.db.doc('results/'+r.id).delete()}catch(e){}}},'Remove'),
 el('button',{class:'btn ghost small',type:'button',onclick:()=>w.replaceChildren(b)},'Keep'))}},'Remove');w.append(b);return w}
function paintBoards(){document.querySelectorAll('.lbbox').forEach(b=>b._paint&&b._paint())}
function board(){app.append(el('div',{class:'row',style:'justify-content:space-between'},el('h2',{},'High scores'),
 el('button',{class:'btn ghost small',type:'button',onclick:()=>go(S.name&&S.started?(S.res.length>=N?results:task):start)},'← Back')),
 el('section',{class:'panel'},el('p',{class:'muted',style:'font-size:14px'},Q.title+' · sorted by mark, then by progress and time. Updates live.'),boardEl()))}
document.getElementById('lbBtn').addEventListener('click',()=>go(board));
/* screens */
function start(){
 if(S.name&&S.started)return go(S.res.length>=N?results:task);
 const inp=el('input',{type:'text',id:'name',placeholder:'First name and surname',autocomplete:'off',value:S.name||''});
 const btn=el('button',{class:'btn',type:'button',disabled:true,onclick:()=>{S.name=inp.value.trim();S.started=Date.now();S.order=Q.tasks.map((_,i)=>i);save();pushResult();go(task)}},'Press start');
 inp.addEventListener('input',()=>btn.disabled=inp.value.trim().length<2);
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)btn.click()});
 btn.disabled=inp.value.trim().length<2;
 const stops=[];Q.stations.forEach((s,i)=>{if(i)stops.push(el('i',{},'→'));stops.push(el('span',{},s))});
 app.append(
  el('section',{style:'display:flex;flex-direction:column;gap:14px'},
   el('p',{class:'eyebrow'},Q.eyebrow),
   el('h1',{},Q.title),
   el('p',{class:'muted',style:'max-width:62ch;font-size:18px'},Q.intro),
   el('div',{class:'stops'},stops)),
  el('div',{class:'rules'},
   el('div',{},el('b',{},N+' tasks'),el('span',{class:'muted'},'the task takes about 30 minutes; the mark is out of 10')),
   el('div',{},el('b',{},'1 step'),el('span',{class:'muted'},'forward for every correct answer'),),
   el('div',{},el('b',{},'2 tries'),el('span',{class:'muted'},'per task: full marks first time, half marks on the second try'))),
  el('div',{class:'panel'},el('label',{for:'name'},el('h3',{class:'blink'},'Enter your name')),inp,el('div',{class:'row'},btn)));
 inp.focus();
}
function refBox(){return Q.ref?el('details',{class:'refbox'},el('summary',{},Q.ref.title),el('div',{class:'refs'},Q.ref.tables.map(t=>el('div',{class:'refwrap'},el('p',{class:'eyebrow',style:'margin-top:8px'},t.name),
 el('table',{class:'ref'},el('tr',{},t.cols.map(c=>el('th',{},c))),t.rows.map(r=>el('tr',{},r.map(v=>el('td',{},v))))))))):null}
function task(){
 if(S.res.length>=N)return results();
 const t=Q.tasks[S.order[S.res.length]];
 let attempt=1;
 const check=el('button',{class:'btn',type:'button',disabled:true},'Check');
 const ui={body:el('div',{style:'display:flex;flex-direction:column;gap:14px'}),locked:false,ready(v){check.disabled=!v}};
 const h=TYPES[t.t](t,ui);
 const fbSlot=el('div',{});
 check.addEventListener('click',()=>{
  if(ui.locked)return;ui.locked=true;
  if(attempt===1){
   const f=h.grade(false);
   if(f===1)return finish(1,true,f);
   attempt=2;check.textContent='Check again';
   fbSlot.replaceChildren(el('div',{class:'fb part',role:'status'},el('span',{class:'v'},'Not yet. One more try'),
    el('p',{},(h.hint?h.hint(f):'Look again and change your answer.')+' A correct second try earns half marks.')));
   h.retry();ui.locked=false;ui.ready(h.isReady());
  } else {const f=h.grade(true);finish(Math.round(f*0.5*100)/100,f===1,f)}
 });
 function finish(p,ok,f){
  check.hidden=true;
  S.res.push({i:S.order[S.res.length],p,ok,c:t.c,a:attempt});
  if(S.res.length>=N&&!S.finished)S.finished=Date.now();
  save();updBar();drawTrack();pushResult();
  const last=S.res.length>=N;
  const nextBtn=el('button',{class:'btn',type:'button',onclick:()=>go(task)},last?'See my result':'Next task');
  const cls=ok?(attempt===1?'ok':'part'):'no';
  fbSlot.replaceChildren(el('div',{class:'fb '+cls,role:'status'},
   el('div',{class:'row',style:'justify-content:space-between'},el('span',{class:'v'},ok?(attempt===1?'Correct · step forward':'Correct on the second try · step forward'):'Not correct · no step this time'),
    el('b',{style:'font-family:var(--mono)'},`+${p}`)),
   !ok?el('div',{},el('p',{style:'font-weight:600'},'Answer'),h.answer()):null,
   el('p',{},t.e)),el('div',{class:'row',style:'margin-top:14px'},nextBtn));
  nextBtn.focus();
 }
 app.append(
  (t.ref!==false&&Q.ref)?refBox():'',
  el('section',{class:'panel'},
   el('div',{class:'thead'},el('span',{class:'code-pill'},t.c),el('span',{class:'muted',style:'font-size:13px'},Q.sub[t.c])),
   t.s?el('div',{class:'scen'},t.s):null,
   el('p',{class:'q'},t.q),ui.body,el('div',{class:'row'},check)),
  fbSlot);
}
function results(){
 if(!S.finished){S.finished=Date.now();save()}
 const m=mark(),reached=correct()===N,cur=stationAt(correct()/N);
 const subs={};S.res.forEach(r=>{(subs[r.c]=subs[r.c]||{p:0,n:0});subs[r.c].p+=r.p;subs[r.c].n++});
 const codes=Object.keys(Q.sub).filter(c=>subs[c]);
 const missed=S.res.filter(r=>r.p<1).map(r=>({t:Q.tasks[r.i],r}));
 app.append(
  el('section',{class:'panel'},
   el('p',{class:'eyebrow'},Q.title+' · result'),
   el('h2',{},S.name),
   el('p',{style:'font-size:18px;font-weight:600'},reached?Q.goalText:`You reached ${Q.stations[cur]}. ${N-correct()} more correct answers would have reached the goal.`),
   el('div',{class:'row',style:'gap:28px;align-items:flex-end'},
    el('div',{},el('div',{class:'big'},m.toFixed(1)),el('p',{class:'muted'},'out of 10')),
    el('div',{style:'display:flex;flex-direction:column;gap:2px'},
     el('p',{},el('b',{},S.res.filter(r=>r.ok&&r.a===1).length),' correct first time'),
     el('p',{},el('b',{},S.res.filter(r=>r.ok&&r.a===2).length),' correct on the second try'),
     el('p',{},el('b',{},S.res.filter(r=>!r.ok).length),' not correct'),
     el('p',{},el('b',{},fmt(S.finished-S.started)),' total time'))),
   el('p',{class:'muted',style:'font-size:14px'},'Show this screen to your teacher.')),
  el('section',{class:'panel'},el('h3',{},'By subtopic'),
   codes.map(c=>{const v=Math.round(subs[c].p/subs[c].n*100);
    return el('div',{class:'res-row'},el('span',{},el('b',{style:'text-align:left;font-family:var(--mono)'},c+' '),Q.sub[c]),
     el('div',{class:'meter'},el('i',{style:`width:${v}%`})),el('b',{},v+'%'))})),
  missed.length?el('section',{class:'panel'},el('h3',{},'Look at these again'),
   el('details',{class:'miss'},el('summary',{},`${missed.length} tasks without full marks`),
    el('ul',{},missed.map(x=>el('li',{},el('b',{},x.t.c+' '),x.t.q,el('br'),el('span',{class:'muted'},x.t.e)))))):null,
  resetBox());
}
function resetBox(){
 const box=el('div',{class:'row',style:'justify-content:flex-end'});
 box.append(el('button',{class:'btn ghost small',type:'button',onclick:()=>{box.replaceChildren(el('span',{class:'muted'},'Erase this attempt?'),
  el('button',{class:'btn small',type:'button',onclick:()=>{const a=(S.attempt||1)+1;S=fresh();S.attempt=a;lastPos=null;save();go(start)}},'Yes, start over'),
  el('button',{class:'btn ghost small',type:'button',onclick:()=>go(results)},'Cancel'))}},'Start over'));
 return box;
}
/* task types: grade(final) returns 0..1; retry() re-opens after a wrong first try */
const TYPES={
 mcq(t,ui){
  let sel=null;const opts=shuffle(t.o.map((x,i)=>({x,i})));
  const bs=opts.map(o=>{const b=el('button',{class:'opt',type:'button',onclick:()=>{if(ui.locked)return;sel=o.i;bs.forEach(x=>x.classList.toggle('sel',x===b));ui.ready(true)}},o.x);b._i=o.i;return b});
  ui.body.append(el('div',{class:'opts'},bs));
  return {grade(final){if(!final&&sel!==0){const b=bs.find(b=>b._i===sel);b.classList.remove('sel');b.classList.add('bad');b.disabled=true;return 0}
    bs.forEach(b=>{b.classList.remove('sel');if(b._i===0)b.classList.add('good');else if(b._i===sel)b.classList.add('bad')});return sel===0?1:0},
   retry(){sel=null},isReady:()=>sel!==null,hint:()=>'That option is crossed out.',answer:()=>el('p',{},t.o[0])};
 },
 multi(t,ui){
  const opts=shuffle(t.o.map((x,i)=>({x:x[0],ok:!!x[1],i})));const on=new Set();
  const bs=opts.map(o=>{const b=el('button',{class:'opt multi',type:'button','aria-pressed':'false',onclick:()=>{if(ui.locked)return;on.has(o.i)?on.delete(o.i):on.add(o.i);b.classList.toggle('sel',on.has(o.i));b.setAttribute('aria-pressed',on.has(o.i));ui.ready(on.size>0)}},o.x);b._o=o;return b});
  ui.body.append(el('p',{class:'how'},'Select all that apply.'),el('div',{class:'opts'},bs));
  const nTrue=opts.filter(o=>o.ok).length;
