<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
/* Layout: a code editor — file tabs as level map, a status bar HUD, each challenge is a code cell with a console under it. Palette from Python's blue + yellow. */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --code:#F5F7FB; --gutter:#E6EBF2; --ink:#15202D; --muted:#5A6878; --line:#D3DBE5;
  --blue:#2D5E97; --bar:#2D5E97; --blue-soft:#E1EAF5; --yellow:#E9B824; --yellow-ink:#3A2C00; --yellow-soft:#FCF1CF;
  --ok:#23804F; --ok-soft:#DDF0E5; --bad:#C0392F; --bad-soft:#F8E0DD;
  --k-kw:#8A3FB0; --k-str:#2F7A35; --k-num:#B4570F; --k-fn:#2D5E97; --k-com:#7F8B99;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1621; --surface:#172130; --code:#121A26; --gutter:#1B2636; --ink:#E5ECF4; --muted:#93A3B6; --line:#2A3748;
  --blue:#7FAEE6; --bar:#24466F; --blue-soft:#1C2B40; --yellow:#F2C94C; --yellow-ink:#2A2000; --yellow-soft:#3A3115;
  --ok:#5CC48A; --ok-soft:#16301F; --bad:#F07B70; --bad-soft:#3A1D1B;
  --k-kw:#C792EA; --k-str:#9CD08A; --k-num:#F2A65A; --k-fn:#82B1FF; --k-com:#6C7A8C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1621; --surface:#172130; --code:#121A26; --gutter:#1B2636; --ink:#E5ECF4; --muted:#93A3B6; --line:#2A3748;
  --blue:#7FAEE6; --bar:#24466F; --blue-soft:#1C2B40; --yellow:#F2C94C; --yellow-ink:#2A2000; --yellow-soft:#3A3115;
  --ok:#5CC48A; --ok-soft:#16301F; --bad:#F07B70; --bad-soft:#3A1D1B;
  --k-kw:#C792EA; --k-str:#9CD08A; --k-num:#F2A65A; --k-fn:#82B1FF; --k-com:#6C7A8C; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 17px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-weight:800;font-size:clamp(40px,8vw,68px);line-height:.95;letter-spacing:-.02em}
h1 .cur{display:inline-block;width:.42em;height:.8em;background:var(--yellow);margin-left:.08em;vertical-align:-.04em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h2{font-weight:600;font-size:clamp(20px,3.4vw,26px);line-height:1.2}
p{margin:0}
code,pre,.mono{font-family:var(--f-mono)}
.eyebrow{font:500 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* tabs */
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px;font:500 13px var(--f-mono);color:var(--muted);border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;margin-bottom:-1px;white-space:nowrap}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tab.cur{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tab.cur .dot{background:var(--yellow)}
.tab.done .dot{background:var(--ok)}
.tab.part .dot{background:var(--bad)}

/* status bar */
.status{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--bar);color:#fff;border-radius:8px;padding:8px 14px;font:500 13px var(--f-mono)}
.status b{font-weight:700;font-variant-numeric:tabular-nums}
.status .sp{flex:1}
.bugs{display:flex;gap:4px;align-items:center}
.bugs i{width:12px;height:12px;border-radius:3px;border:1.5px solid rgba(255,255,255,.6)}
.bugs i.on{background:var(--yellow);border-color:var(--yellow)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--yellow);transition:width .4s}

/* cell */
.cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,3.6vw,28px);display:flex;flex-direction:column;gap:16px}
.cell-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.badge{font:700 12px var(--f-mono);background:var(--yellow);color:var(--yellow-ink);padding:3px 8px;border-radius:4px}
.q{font-size:clamp(17px,2.4vw,19px);font-weight:700;line-height:1.45;max-width:65ch}
.q code{font-size:.9em;background:var(--code);border:1px solid var(--line);padding:0 5px;border-radius:4px;font-weight:500}
.q pre{font-size:14px;font-weight:400;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0 0;overflow-x:auto}

.code{background:var(--code);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font:400 15px/1.65 var(--f-mono)}
.code .ln{display:grid;grid-template-columns:3em max-content;min-width:100%;transition:background .2s}
.code .ln>span:first-child{color:var(--muted);text-align:right;padding-right:14px;background:var(--gutter);user-select:none;font-size:13px;line-height:1.65rem}
.code .ln>span:first-child{line-height:inherit}
.code .ln>code{white-space:pre;padding:0 16px 0 12px}
.code .ln:first-child>*{padding-top:10px}.code .ln:last-child>*{padding-bottom:10px}
.code .ln.hl{background:var(--yellow-soft)}
.code .ln.hl>span:first-child{background:var(--yellow);color:var(--yellow-ink)}
.code.pick .ln{cursor:pointer}
.code.pick .ln:hover{background:var(--blue-soft)}
.code .ln.ok{background:var(--ok-soft)} .code .ln.ok>span:first-child{background:var(--ok);color:#fff}
.code .ln.no{background:var(--bad-soft)} .code .ln.no>span:first-child{background:var(--bad);color:#fff}
.tk-kw{color:var(--k-kw);font-weight:500}.tk-str{color:var(--k-str)}.tk-num{color:var(--k-num)}.tk-fn{color:var(--k-fn)}.tk-com{color:var(--k-com);font-style:italic}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.text{grid-template-columns:1fr}
@media (max-width:600px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--code);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.4;min-width:0}
.opt pre{margin:0;font:500 14px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.opt .k{font:700 13px var(--f-mono);color:var(--muted);flex:0 0 auto}
.opt code{font-size:.92em}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}

.term{display:flex;align-items:center;gap:0;background:var(--code);border:1.5px solid var(--line);border-radius:8px;padding-left:14px;font:500 16px var(--f-mono)}
.term:focus-within{border-color:var(--blue)}
.term .pr{color:var(--muted);user-select:none}
.term input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:12px 10px;outline:none}
.term.ok{border-color:var(--ok);background:var(--ok-soft)} .term.no{border-color:var(--bad);background:var(--bad-soft)}
.term button{border:0;background:var(--ink);color:var(--bg);font:700 14px var(--f-body);padding:0 18px;align-self:stretch;border-radius:0 6px 6px 0}
.hint{font-size:14px;color:var(--muted)}

.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--code);border:1.5px solid transparent;border-radius:8px;padding:8px 8px 8px 14px}
.row .txt{min-width:0;line-height:1.35}
.row.ok{border-color:var(--ok)} .row.no{border-color:var(--bad)}
.row .fix{grid-column:1/-1;font:500 12px var(--f-mono);color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:7px 11px;font:700 13px var(--f-mono);min-width:52px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
.seg button:disabled{cursor:default}
@media (max-width:520px){.row{grid-template-columns:1fr}.seg{justify-self:start}}

.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:12px 20px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:default}
.btn.y{background:var(--yellow);color:var(--yellow-ink)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.console{background:var(--code);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.console-h{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;background:var(--gutter);font:500 12px var(--f-mono);color:var(--muted)}
.console pre{margin:0;padding:12px 14px;font:500 15px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.verdict{display:grid;gap:6px;border-radius:8px;padding:14px 16px;border-left:4px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.no{background:var(--bad-soft);border-color:var(--bad)}
.verdict strong{font:700 13px var(--f-mono);letter-spacing:.04em}
.verdict.ok strong{color:var(--ok)} .verdict.no strong{color:var(--bad)}
.verdict p{max-width:68ch}
.verdict code{font-size:.9em}

.trace{display:grid;gap:10px}
.tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tt{border-collapse:collapse;width:100%;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.tt th{background:var(--gutter);text-align:left;padding:7px 12px;font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.06em}
.tt td{padding:6px 12px;border-top:1px solid var(--line);white-space:nowrap}
.tt td.ch{background:var(--yellow-soft);font-weight:700}
.tt tr.cur td{outline:0;box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--blue) 10%,transparent)}
.tt td.none{color:var(--muted)}

/* intro */
.hero{display:grid;gap:14px}
.lead{font-size:19px;max-width:56ch;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.how>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:4px;align-content:start;min-width:0}
.how b{font:700 14px var(--f-mono)}
.how span{font-size:15px;color:var(--muted);line-height:1.4}
@media (max-width:640px){.how{grid-template-columns:1fr}}
.files{display:grid;gap:8px}
.file{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px}
.file:hover{border-color:var(--blue)}
.file .fn{font:700 15px var(--f-mono)}
.file .nm{color:var(--muted);font-size:15px}
.file .c{font:500 12px var(--f-mono);color:var(--muted)}
.file .n{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:520px){.file{grid-template-columns:minmax(0,1fr) auto}.file .c{display:none}}
.foot{font-size:14px;color:var(--muted)}

/* end */
.big{font:800 clamp(48px,11vw,80px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end}
.res{display:grid;gap:8px}
.res .r{display:grid;grid-template-columns:130px minmax(0,1fr) 46px;gap:12px;align-items:center;font-size:15px}
.res .r .f{font:500 13px var(--f-mono)}
.bar{height:8px;background:var(--code);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.res .r .v{font:500 13px var(--f-mono);text-align:right}
.miss{display:grid;gap:8px}
.miss details{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.miss summary{cursor:pointer;font-weight:700}
.miss details p{margin-top:8px;color:var(--muted);max-width:68ch}


/* sticky dock: status + route map */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.prog{display:none}
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 4px;display:grid;gap:8px}
.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;line-height:0}
.map svg{display:block;width:100%;height:auto;max-width:100%}
.m-trail{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
.m-done{fill:none;stroke:var(--yellow);stroke-width:6;stroke-linecap:round}
.m-ticks circle{fill:var(--line)} .m-ticks circle.on{fill:var(--yellow-ink);opacity:.35}
.m-stone circle,.m-start circle{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.m-stone.on circle{fill:var(--ok);stroke:var(--ok)}
.map text{font:600 11px var(--f-mono);fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.m-stone.on text{fill:var(--ok)}
.g-box{fill:var(--bar);stroke:var(--bar);stroke-width:2}
.m-goal line{stroke:#fff;stroke-opacity:.55;stroke-width:2;stroke-linecap:round}
.g-led{fill:var(--yellow)}
.m-goal text{fill:var(--ink);font-weight:700}
.map.reached .g-led{fill:var(--ok)}
.map.reached .g-box{animation:glow 1.2s ease-in-out 3}
@keyframes glow{50%{fill:var(--ok);stroke:var(--ok)}}
.sn.b{fill:var(--blue)} .sn.y{fill:var(--yellow)}
.sn{stroke:var(--surface);stroke-width:1.5}
.eye{fill:#fff} .pupil{fill:#15202D}
.map.hurt .m-snake{animation:wig .45s}
.map.hurt .sn.b{animation:red .9s}
@keyframes wig{20%{transform:translateY(-4px)}40%{transform:translateY(3px)}60%{transform:translateY(-2px)}80%{transform:translateY(1px)}}
@keyframes red{0%,60%{fill:var(--bad)}}
.fx{font:800 15px var(--f-display)!important;animation:rise 1.1s ease-out forwards}
.fx.ok{fill:var(--ok)!important} .fx.no{fill:var(--bad)!important}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-18px)}}
.again{color:var(--bad);font-weight:700}
@media (max-width:560px){.map text{font-size:10px}}

@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const LEVELS = [{"file": "variables.py", "code": "B2.1.1", "name": "Variables & data types", "short": "Variables", "qs": [{"t": "sort", "q": "Sort each value into its Python data type.", "cats": ["int", "float", "str", "bool"], "items": [["7", 0], ["3.14", 1], ["\"7\"", 2], ["True", 3], ["\"True\"", 2], ["-12", 0], ["0.5", 1], ["\"A\"", 2]], "w": "Quotes make any value a string, so \"7\" and \"True\" are str. A number with a decimal point is a float. True and False without quotes are bool. Python has no separate char type: \"A\" is a string of length 1."}, {"t": "mc", "q": "Which data type should store a telephone number such as <code>+7 701 123 4567</code>?", "o": ["int, because it is made of digits", "str, because it has symbols and leading digits and we never do arithmetic on it", "float", "bool"], "a": 1, "w": "A phone number is an identifier, not a quantity. It can start with + or 0 and contains spaces, and nobody adds two phone numbers. Store it as a string."}, {"t": "out", "code": "a = \"5\"\nb = 3\nprint(a * b)", "w": "a is the string \"5\", so * repeats it 3 times: \"555\". With a = 5 (an int) the result would be 15.", "output": "555", "a": ["555"]}, {"t": "outmc", "code": "x = 5\n\ndef change():\n    x = 10\n    print(x)\n\nchange()\nprint(x)", "o": ["10\n5", "10\n10", "5\n5", "5\n10"], "w": "x = 10 inside the function creates a new local variable. The global x stays 5. The local x disappears when the function ends.", "output": "10\n5", "a": 0}, {"t": "bug", "q": "This program crashes with <code>UnboundLocalError</code>. Click the line that causes it.", "code": "score = 0\n\ndef add_point():\n    score = score + 1\n\nadd_point()\nprint(score)", "lines": [4], "w": "Because score is assigned inside the function, Python treats it as local, and the right side reads it before it has a value. Fix: add <code>global score</code> as the first line of the function."}, {"t": "outmc", "code": "print(type(7 / 2))\nprint(type(7 // 2))", "o": ["<class 'float'>\n<class 'int'>", "<class 'int'>\n<class 'int'>", "<class 'float'>\n<class 'float'>", "<class 'int'>\n<class 'float'>"], "w": "/ always returns a float (3.5). // is integer division and returns an int (3).", "output": "<class 'float'>\n<class 'int'>", "a": 0}, {"t": "sort", "q": "Storing data: which data type would you recommend for each item?", "cats": ["int", "float", "str", "bool"], "items": [["A telephone number", 2], ["Whether a person is vegan", 3], ["A password", 2], ["The cost of an item", 1], ["Glasses of water drunk today", 0], ["A person’s middle initial", 2]], "w": "Phone numbers and passwords are text, not quantities, so they are strings. Yes/no facts are bool. Money has decimals, so float. A count of glasses is a whole number, so int. Python stores a single character as a str."}, {"t": "out", "code": "x = 7\ny = 2\nprint(x // y, x % y)", "w": "// is integer division: 7 // 2 = 3. % is the remainder: 7 % 2 = 1. print() separates values with a space.", "output": "3 1", "a": ["3 1"]}, {"t": "out", "code": "print(int(\"12\") + 3)", "w": "int(\"12\") converts the string to the integer 12, so this is arithmetic: 12 + 3 = 15.", "output": "15", "a": ["15"]}, {"t": "out", "code": "print(\"12\" + \"3\")", "w": "Both values are strings, so + joins them (concatenation) instead of adding numbers.", "output": "123", "a": ["123"]}, {"t": "out", "code": "print(int(3.9))", "w": "int() cuts off the decimal part. It does not round: int(3.9) is 3.", "output": "3", "a": ["3"]}, {"t": "out", "code": "print(10 / 4)", "w": "/ is true division and always gives a float.", "output": "2.5", "a": ["2.5"]}, {"t": "outmc", "code": "count = 0\n\ndef add():\n    global count\n    count = count + 1\n\nadd()\nadd()\nprint(count)", "o": ["2", "0", "1", "UnboundLocalError"], "w": "global count tells the function to use the global variable instead of creating a local one. The function runs twice, so count becomes 2.", "output": "2", "a": 0}, {"t": "bug", "q": "This program crashes with <code>TypeError const QUICK_PER_FILE = 4;
const bugLimit = n => Math.max(5, Math.round(n/7));
const $ = (s,el=document)=>el.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let G=null, best={full:0,quick:0};
try{best.full=+localStorage.getItem('tracequest-best-full')||0;best.quick=+localStorage.getItem('tracequest-best-quick')||0}catch(e){}

const KW=new Set('and as break class continue def del elif else for from global if import in is lambda not or pass return while True False None'.split(' '));
const FN=new Set('print len range input int str float type sum min max sorted list reversed'.split(' '));
function hl(line){
  const re=/(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(\d+(?:\.\d+)?)\b|([A-Za-z_]\w*)|([\s\S])/g;
  let out='',m;
  while((m=re.exec(line))){
    if(m[1]) out+=`<span class="tk-com">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="tk-str">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="tk-num">${m[3]}</span>`;
    else if(m[4]) out+= KW.has(m[4])?`<span class="tk-kw">${m[4]}</span>`: FN.has(m[4])?`<span class="tk-fn">${m[4]}</span>`: m[4];
    else out+=esc(m[5]);
  }
  return out||' ';
}
function codeBlock(code,pick){
  return `<div class="code${pick?' pick':''}" role="${pick?'group':'presentation'}">${code.split('\n').map((l,i)=>
    pick?`<div class="ln" role="button" tabindex="0" data-n="${i+1}" aria-label="Line ${i+1}"><span>${i+1}</span><code>${hl(l)}</code></div>`
        :`<div class="ln" data-n="${i+1}"><span>${i+1}</span><code>${hl(l)}</code></div>`).join('')}</div>`;
}

/* ---------- route map: a Python crawls along a winding path to the server ---------- */
function makeMap(host, files){
  const target = files.reduce((a,f)=>a+f.n,0);
  let W=0,H=0,len=0,path=null,s=0,raf=0,reached=false;
  const SEG=7;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function build(){
    const w = Math.round(host.clientWidth);
    if(!w || w===W) return;
    W=w; H = W<560?124:150;
    const x0=22, x1=W-58, mid=H*.54, amp=H*.18, periods=Math.max(1.25,(x1-x0)/300);
    const pts=[];
    for(let x=x0;x<=x1;x+=6){const t=(x-x0)/(x1-x0); pts.push(x.toFixed(1)+' '+(mid+amp*Math.sin(t*periods*2*Math.PI)).toFixed(1))}
    const d='M'+pts.join(' L');
    host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
      <path class="m-trail" d="${d}"/><path class="m-done" d="${d}"/>
      <g class="m-ticks"></g><g class="m-stones"></g><g class="m-goal"></g><g class="m-snake"></g><g class="m-fx"></g></svg>`;
    path=host.querySelector('.m-trail'); len=path.getTotalLength();
    const done=host.querySelector('.m-done'); done.style.strokeDasharray=len+' '+len;
    const P=f=>path.getPointAtLength(f*len);
    // step ticks
    let ticks=''; if(target<=120) for(let i=1;i<target;i++){const p=P(i/target);ticks+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="1.6" data-i="${i}"/>`}
    host.querySelector('.m-ticks').innerHTML=ticks;
    // milestones at the end of each file
    let acc=0, st='';
    const sp=P(0); st+=`<g class="m-start"><circle cx="${sp.x}" cy="${sp.y}" r="5"/><text x="${sp.x}" y="${sp.y+(sp.y>mid?-20:28)}" text-anchor="start">start</text></g>`;
    files.forEach((f,k)=>{ acc+=f.n; if(k===files.length-1) return;
      const p=P(acc/target), up=p.y>mid;
      st+=`<g class="m-stone" data-at="${acc}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6"/><text x="${p.x.toFixed(1)}" y="${(up?p.y-20:p.y+30).toFixed(1)}" text-anchor="middle">${esc(f.label)}</text></g>`});
    host.querySelector('.m-stones').innerHTML=st;
    const e=P(1), gx=e.x+12, gy=e.y-22;
    host.querySelector('.m-goal').innerHTML=`
      <rect class="g-box" x="${gx}" y="${gy}" width="30" height="40" rx="4"/>
      <line x1="${gx+6}" y1="${gy+11}" x2="${gx+24}" y2="${gy+11}"/><line x1="${gx+6}" y1="${gy+20}" x2="${gx+24}" y2="${gy+20}"/>
      <circle class="g-led" cx="${gx+9}" cy="${gy+31}" r="2.6"/>
      <text x="${gx+15}" y="${e.y>mid?gy-8:gy+56}" text-anchor="middle">${files.length>1?'exit 0':esc(files[0].label)}</text>`;
    host.querySelector('.m-snake').innerHTML =
      Array.from({length:SEG},(_,i)=>`<circle class="sn ${i%2?'y':'b'}" r="${(8.5-i*0.7).toFixed(1)}"/>`).reverse().join('')+
      `<circle class="sn b head" r="10"/><circle class="eye" r="3.4"/><circle class="pupil" r="1.7"/>`;
    draw();
  }
  function draw(){
    if(!path) return;
    const P=l=>path.getPointAtLength(Math.max(0,Math.min(len,l)));
    host.querySelector('.m-done').style.strokeDashoffset=(len-s);
    const sn=[...host.querySelectorAll('.m-snake .sn')]; // body (tail first) then head
    const head=P(s), ahead=P(s+4), back=P(s-4);
    const ang=Math.atan2(ahead.y-back.y,ahead.x-back.x);
    sn.forEach((c,i)=>{const k=sn.length-1-i; const p=k===0?head:P(s-k*10.5); c.setAttribute('cx',p.x.toFixed(1)); c.setAttribute('cy',p.y.toFixed(1))});
    const ex=head.x+Math.cos(ang-0.9)*4.5, ey=head.y+Math.sin(ang-0.9)*4.5;
    const eye=host.querySelector('.eye'), pu=host.querySelector('.pupil');
    eye.setAttribute('cx',ex.toFixed(1)); eye.setAttribute('cy',ey.toFixed(1));
    pu.setAttribute('cx',(ex+Math.cos(ang)*1.2).toFixed(1)); pu.setAttribute('cy',(ey+Math.sin(ang)*1.2).toFixed(1));
    const steps=Math.round(s/len*target);
    host.querySelectorAll('.m-ticks circle').forEach(c=>c.classList.toggle('on',+c.dataset.i<=steps));
    host.querySelectorAll('.m-stone').forEach(g=>g.classList.toggle('on',+g.dataset.at<=steps));
    host.classList.toggle('reached',reached);
  }
  let goalDist=0;
  function moveTo(dist){
    goalDist=dist;
    const to=dist/target*len, from=s; reached = dist>=target;
    cancelAnimationFrame(raf);
    if(reduce||!len){s=to;draw();return}
    const t0=performance.now(), dur=Math.min(1100,450+Math.abs(to-from)*4);
    const tick=now=>{const t=Math.min(1,(now-t0)/dur), e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; s=from+(to-from)*e; draw(); if(t<1) raf=requestAnimationFrame(tick)};
    raf=requestAnimationFrame(tick);
    if(to>from) fx('+1','ok',to);
  }
  function fx(txt,cls,at){
    if(!path) return;
    const p=path.getPointAtLength(at ?? s);
    const g=host.querySelector('.m-fx');
    g.innerHTML=`<text class="fx ${cls}" x="${p.x.toFixed(1)}" y="${(p.y-16).toFixed(1)}" text-anchor="middle">${txt}</text>`;
  }
  function hurt(){
    host.classList.remove('hurt'); void host.offsetWidth; host.classList.add('hurt');
    fx('bug','no');
  }
  const ro = window.ResizeObserver ? new ResizeObserver(()=>{W=0;build()}) : null;
  if(ro) ro.observe(host); else window.addEventListener('resize',()=>{W=0;build()});
  build();
  return {moveTo, hurt, target, set(d){goalDist=d;s=d/target*len;reached=d>=target;draw()}};
}

  <section class="files">

  </section>
  <p class="foot">Built from lessons 1–4 of the B2 Programming unit. Every output was checked by running the code in Python.</p>`;

  $('#go').onclick=()=>start(LEVELS.map((_,i)=>i),'full');
  $('#quick').onclick=()=>start(LEVELS.map((_,i)=>i),'quick');
  app.querySelectorAll('.file').forEach(b=>b.onclick=()=>start([+b.dataset.i],'file'));
}

let MAP=null;
function start(list,mode){
  const queue=[], res={};
  list.forEach(li=>{
    let ids=shuffle(LEVELS[li].qs.map((_,qi)=>qi));
    if(mode==='quick') ids=ids.slice(0,QUICK_PER_FILE);
    ids.forEach(qi=>queue.push({li,qi,retry:false})); res[li]={ok:0,n:ids.length};
  });
  G={list,queue,pos:0,bugs:0,score:0,streak:0,res,miss:[],mode,dist:0,target:queue.length,maxBugs:bugLimit(queue.length)};
  app.innerHTML=`
    <div class="dock">
      <div class="status">
        <span>Steps <b id="s-pos"></b></span><span>Score <b id="s-score"></b></span><span>Streak <b id="s-streak"></b></span>
        <span class="sp"></span><span>Bugs</span><span class="bugs" id="s-bugs">${'<i></i>'.repeat(G.maxBugs)}</span>
      </div>
      <div class="map" id="map"></div>
    </div>
    <nav class="tabs" id="tabs">${list.map(li=>`<span class="tab" data-li="${li}"><span class="dot"></span>${LEVELS[li].file}</span>`).join('')}</nav>
    <div class="cell" id="cell"></div>
    <div class="btns"><button class="btn alt" id="quit">Menu</button></div>`;
  MAP=makeMap($('#map'),list.map(li=>({label:LEVELS[li].short,n:res[li].n})));
  $('#quit').onclick=intro;
  render();
}

function hud(){
  $('#s-pos').textContent=G.dist+'/'+G.target;
  $('#s-score').textContent=G.score; $('#s-streak').textContent='×'+G.streak;
  $('#s-bugs').querySelectorAll('i').forEach((b,i)=>b.classList.toggle('on',i<G.bugs));
  const cur=G.pos<G.queue.length?G.queue[G.pos].li:-1;
  document.querySelectorAll('.tab').forEach(t=>{
    const li=+t.dataset.li; t.className='tab';
    if(li===cur){t.classList.add('cur');t.scrollIntoView({block:'nearest',inline:'nearest'})}
    else if(!G.queue.slice(G.pos).some(q=>q.li===li)) t.classList.add(G.res[li].ok===G.res[li].n?'done':'part');
  });
}

function render(){
  hud();
  if(G.pos>=G.queue.length) return finish(true);
  const {li,qi,retry}=G.queue[G.pos], L=LEVELS[li], Q=L.qs[qi];
  const prompt = Q.q || (Q.t==='out'?'What does this program print?':'Which output does this program produce?');
  const k=G.queue.slice(0,G.pos+1).filter(q=>q.li===li&&!q.retry).length;
  const cell=$('#cell');
  cell.innerHTML=`
    <div class="cell-h"><span class="badge">${L.code}</span><h2>${L.name}</h2><span class="eyebrow">${retry?'<span class="again">second try</span>':`task ${k} of ${G.res[li].n}`}</span></div>
    <div class="q">${prompt}</div>
    ${Q.code?codeBlock(Q.code,Q.t==='bug'):''}
    <div id="body"></div><div id="fb" class="trace"></div>`;
  ({mc:rMC,outmc:rMC,out:rOut,bug:rBug,sort:rSort})[Q.t]($('#body'),Q);
  const f=cell.querySelector('#body button,#body input,.code.pick .ln'); if(f) f.focus({preventScroll:true});
}

function rMC(body,Q){
  const isCode=Q.t==='outmc';
  const order=shuffle(Q.o.map((_,i)=>i));
  body.innerHTML=`<div class="opts${isCode?'':' text'}">${order.map((i,k)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[k]}</span>${isCode?`<pre>${esc(Q.o[i])}</pre>`:`<span>${Q.o[i]}</span>`}</button>`).join('')}</div>`;
  body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===Q.a;
    body.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===Q.a)x.classList.add('ok')});
    if(!ok)b.classList.add('no');
    answer(ok,Q);
  });
}

const norm=s=>s.trim().replace(/^(['"])(.*)\1$/,'$2').replace(/\s+/g,' ').trim();
function rOut(body,Q){
  body.innerHTML=`<form class="term" id="tf"><span class="pr">&gt;&gt;&gt;</span><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Program output" placeholder="type the output"><button type="submit">Run</button></form>
    <p class="hint" style="margin-top:8px">Case matters: <code>True</code> is not <code>true</code>.</p>`;
  $('#tf').onsubmit=e=>{
    e.preventDefault(); const inp=$('#ti'); const v=norm(inp.value);
    if(!v){$('#tf').classList.add('shake');setTimeout(()=>$('#tf')&&$('#tf').classList.remove('shake'),500);return}
    const ok=Q.a.map(norm).includes(v);
    $('#tf').classList.add(ok?'ok':'no'); inp.disabled=true; $('#tf button').remove(); body.querySelector('.hint').remove();
    answer(ok,Q);
  };
}

function rBug(body,Q){
  body.innerHTML=`<p class="hint">Click or tap a line in the code above.</p>`;
  const lines=[...document.querySelectorAll('.code.pick .ln')];
  const pick=ln=>{
    if(!G||ln.closest('.code').classList.contains('done'))return;
    ln.closest('.code').classList.add('done'); ln.closest('.code').classList.remove('pick');
    const n=+ln.dataset.n, ok=Q.lines.includes(n);
    lines.forEach(l=>{l.removeAttribute('role');l.removeAttribute('tabindex');if(Q.lines.includes(+l.dataset.n))l.classList.add('ok')});
    if(!ok)ln.classList.add('no');
    body.innerHTML='';
    answer(ok,Q);
  };
  lines.forEach(ln=>{ln.onclick=()=>pick(ln);ln.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(ln)}}});
}

function rSort(body,Q){
  const items=shuffle(Q.items.map((it,i)=>({t:it[0],a:it[1],i})));
  const sel={}; const mono=Q.cats[0]==='int';
  body.innerHTML=`<div class="rows">${items.map(it=>`
    <div class="row" data-i="${it.i}"><span class="txt${mono?' mono':''}">${esc(it.t)}</span>
      <div class="seg" role="group" aria-label="${esc(it.t)}">${Q.cats.map((c,k)=>`<button data-v="${k}" aria-pressed="false">${c}</button>`).join('')}</div></div>`).join('')}</div>
    <button class="btn" id="chk" disabled style="margin-top:14px">Check</button>`;
  body.querySelectorAll('.row').forEach(r=>r.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    sel[r.dataset.i]=+b.dataset.v; r.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#chk').disabled=Object.keys(sel).length<items.length;
  }));
  $('#chk').onclick=()=>{
    let ok=true;
    items.forEach(it=>{const r=body.querySelector(`.row[data-i="${it.i}"]`),good=sel[it.i]===it.a; ok=ok&&good; r.classList.add(good?'ok':'no'); r.querySelectorAll('button').forEach(x=>x.disabled=true);
      if(!good){const s=document.createElement('span');s.className='fix';s.textContent='→ '+Q.cats[it.a];r.appendChild(s)}});
    $('#chk').remove(); answer(ok,Q);
  };
}

function answer(ok,Q){
  const cur=G.queue[G.pos], li=cur.li;
  if(ok){
    G.streak++; G.score+=(cur.retry?50:100)+Math.min(G.streak-1,5)*20;
    if(!cur.retry) G.res[li].ok++;
    G.dist++; MAP.moveTo(G.dist);
  } else {
    G.streak=0; G.bugs++;
    if(!cur.retry) G.miss.push({li,Q});
    const c=$('#cell'); c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500);
    MAP.hurt();
    if(G.bugs<G.maxBugs){ // send the task back to the end of this file
      let j=G.pos; G.queue.forEach((q,i)=>{if(q.li===li&&i>=G.pos) j=i});
      G.queue.splice(j+1,0,{li,qi:cur.qi,retry:true});
    }
  }
  hud();
  const dead=G.bugs>=G.maxBugs, last=G.pos===G.queue.length-1;
  const fb=$('#fb');
  let html='';
  if(Q.output!==undefined) html+=`<div class="console"><div class="console-h"><span>Console</span><span>exit code 0</span></div><pre>${esc(Q.output)}</pre></div>`;
  html+=`<div class="verdict ${ok?'ok':'no'}"><strong>${ok?'✓ Correct · +1 step':'✗ Bug +1 · this task will come back later'}</strong><p>${Q.w}</p></div>`;
  if(Q.trace) html+=`<div class="btns"><button class="btn alt" id="play">▶ Step through the trace table</button></div><div id="tt"></div>`;
  html+=`<div class="btns"><button class="btn y" id="nx">${dead?'Show traceback':last?'Reach the server':'Next task →'}</button></div>`;
  fb.innerHTML=html;
  if(Q.trace) $('#play').onclick=()=>playTrace(Q);
  $('#nx').onclick=()=>{ if(dead) return finish(false); G.pos++; render(); window.scrollTo({top:0,behavior:'smooth'}) };
  (Q.trace?$('#play'):$('#nx')).focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}

let traceTimer=null;
function playTrace(Q){
  clearInterval(traceTimer);
  const box=$('#tt'), w=Q.watch, rows=Q.trace;
  box.innerHTML=`<div class="tt-wrap"><table class="tt"><thead><tr><th>LINE</th>${w.map(v=>`<th>${esc(v)}</th>`).join('')}<th>OUTPUT</th></tr></thead><tbody></tbody></table></div>`;
  const tb=box.querySelector('tbody'), lines=[...document.querySelectorAll('#cell .code .ln')];
  let k=0, prev=w.map(()=>null);
  const btn=$('#play'); btn.textContent='■ Skip to the end';
  const step=()=>{
    if(k>=rows.length){clearInterval(traceTimer);lines.forEach(l=>l.classList.remove('hl'));btn.textContent='↺ Replay trace';btn.onclick=()=>playTrace(Q);tb.querySelectorAll('tr').forEach(r=>r.classList.remove('cur'));k++;return}
    const r=rows[k];
    tb.querySelectorAll('tr').forEach(x=>x.classList.remove('cur'));
    const tr=document.createElement('tr'); tr.className='cur';
    tr.innerHTML=`<td>${r.line}</td>${r.vals.map((v,i)=>`<td class="${v===null?'none':v!==prev[i]?'ch':''}">${v===null?'—':esc(v)}</td>`).join('')}<td>${esc(r.out)}</td>`;
    tb.appendChild(tr); prev=r.vals;
    lines.forEach(l=>l.classList.toggle('hl',+l.dataset.n===r.line));
    k++;
  };
  btn.onclick=()=>{while(k<=rows.length)step()};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){while(k<=rows.length)step()} else {step();traceTimer=setInterval(step,650)}
}

function finish(ok){
  clearInterval(traceTimer);
  const total=G.target, right=Object.values(G.res).reduce((n,r)=>n+r.ok,0);
  const bonus=ok?(G.maxBugs-G.bugs)*100:0;
  if(ok){ G.score+=bonus; if(G.mode!=='file'&&G.score>best[G.mode]){best[G.mode]=G.score;try{localStorage.setItem('tracequest-best-'+G.mode,G.score)}catch(e){}} }
  hud();
  const li=ok?null:G.queue[G.pos].li;
  const msg=!ok?`The Python got ${G.dist} of ${total} steps along the route. Debug and continue from here, or review the mistakes below.`
    : right===total?'Reached the server on the first try for every task. You trace code like the interpreter.'
    : right/total>=.8?'Reached the server. A few tasks needed a second try; review them below.'
    : 'Reached the server, but many tasks needed a second try. Work through the review and run it again.';
  $('#cell').innerHTML=`
    <div class="console"><div class="console-h"><span>Console</span><span>${ok?'exit code 0':'exit code 1'}</span></div>
      <pre>${ok?`Python reached the server.\nProcess finished with exit code 0`:`Traceback (most recent call last):\n  File "${LEVELS[li].file}", step ${G.dist+1}, in &lt;module&gt;\nTooManyBugsError: ${G.maxBugs} bugs found`}</pre></div>
    <h2>${ok?'Server reached':'Program crashed'}</h2>
    <div class="stats">
      <div><div class="big">${G.score}</div><span class="eyebrow">points${ok?` · bonus +${bonus} for unused bugs`:''}</span></div>
      <div><div class="big" style="color:var(--ok)">${right}<span style="color:var(--muted);font-size:.5em">/${total}</span></div><span class="eyebrow">right on the first try</span></div>
    </div>
    <p>${msg}</p>
    <div class="res">${G.list.map(i=>{const r=G.res[i];return `<div class="r"><span class="f">${LEVELS[i].file}</span><span class="bar"><i style="width:${r.ok/r.n*100}%"></i></span><span class="v">${r.ok}/${r.n}</span></div>`}).join('')}</div>
    ${G.miss.length?`<div class="miss"><span class="eyebrow">Review your bugs</span>${G.miss.map(m=>`<details><summary>${LEVELS[m.li].file} · ${(m.Q.q||'').replace(/<pre>[\s\S]*<\/pre>/,'').replace(/<[^>]+>/g,'')||esc((m.Q.code||'').split('\n')[0])+' …'}</summary>${m.Q.code?codeBlock(m.Q.code,false):''}<p>${m.Q.w}</p></details>`).join('')}</div>`:''}
    <div class="btns">
      ${!ok?'<button class="btn y" id="debug">Debug and continue · score ÷ 2</button>':''}
      <button class="btn ${ok?'y':'alt'}" id="again">New run</button>
      <button class="btn alt" id="menu">Menu</button>
    </div>`;
  const d=$('#debug');
  if(d) d.onclick=()=>{const cur=G.queue[G.pos]; G.queue.splice(G.pos+1,0,{li:cur.li,qi:cur.qi,retry:true}); G.pos++; G.bugs=0; G.streak=0; G.score=Math.floor(G.score/2); $('#s-bugs').querySelectorAll('i').forEach(b=>b.classList.remove('on')); render(); window.scrollTo({top:0,behavior:'smooth'})};
  $('#again').onclick=()=>start(G.list,G.mode);
  $('#menu').onclick=intro;
  window.scrollTo({top:0,behavior:'smooth'});
}

intro();
</script>
</body>
</html>
